spring.application.name=mdm-server

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/mdm?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
spring.datasource.username=mdm_app
spring.datasource.password=${MDM_DB_PASSWORD}

# Spring Boot 项目中 MyBatis 的配置
# 自动将数据库字段名中的下划线命名转换为Java属性中的小驼峰命名
mybatis.configuration.map-underscore-to-camel-case=true